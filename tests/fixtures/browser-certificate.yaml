apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: browser-check
  namespace: signet
spec:
  secretName: browser-check
  commonName: app.example.com
  dnsNames:
    - app.example.com
  duration: 1h
  renewBefore: 20m
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    group: signet.io
    kind: SignetIssuer
    name: manual
