apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "signet.name" . }}-{{ .Release.Namespace }}
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["signet.io"]
    resources: ["signetissuers", "signetclusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["signet.io"]
    resources: ["signetissuers/status", "signetclusterissuers/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/approval"]
    verbs: ["update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
    resourceNames:
      {{- range .Values.issuerInstances }}
      {{- if eq .kind "SignetIssuer" }}
      - {{ printf "signetissuers.signet.io/%s.%s" .namespace .name | quote }}
      {{- else }}
      - {{ printf "signetclusterissuers.signet.io/%s" .name | quote }}
      {{- end }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "signet.name" . }}-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "signet.name" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "signet.name" . }}
    namespace: {{ .Release.Namespace }}
