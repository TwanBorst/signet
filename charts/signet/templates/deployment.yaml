apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signet.name" . }}
  labels:
    {{- include "signet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "signet.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signet.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "signet.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.database.secretName }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            {{- else }}
            - name: DATABASE_HOST
              value: {{ .Values.database.host | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName | quote }}
                  key: {{ .Values.database.passwordSecretKey | quote }}
            {{- if or .Values.database.caConfigMap .Values.database.caSecretName }}
            - name: DATABASE_SSLROOTCERT
              value: /etc/signet/db-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.publicOrigins }}
            - name: PUBLIC_ORIGINS
              value: {{ .Values.publicOrigins | toJson | quote }}
            {{- else }}
            - name: PUBLIC_ORIGIN
              value: {{ .Values.publicOrigin | quote }}
            {{- end }}
            - name: AUTH_HEADER
              value: {{ .Values.authHeader | quote }}
            - name: DEPLOYMENT_MODE
              value: {{ .Values.deployment.mode | quote }}
            {{- if eq .Values.deployment.mode "namespace" }}
            - name: WATCH_NAMESPACE
              value: {{ default .Release.Namespace .Values.deployment.namespace | quote }}
            {{- end }}
          {{- if or .Values.database.caConfigMap .Values.database.caSecretName }}
          volumeMounts:
            - name: database-ca
              mountPath: /etc/signet/db-ca
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.database.caConfigMap .Values.database.caSecretName }}
      volumes:
        - name: database-ca
          {{- if .Values.database.caSecretName }}
          secret:
            secretName: {{ .Values.database.caSecretName | quote }}
            items:
              - key: {{ .Values.database.caKey | quote }}
                path: ca.crt
          {{- else }}
          configMap:
            name: {{ .Values.database.caConfigMap | quote }}
            items:
              - key: {{ .Values.database.caKey | quote }}
                path: ca.crt
          {{- end }}
      {{- end }}
