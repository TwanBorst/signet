apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - policies.yaml
patches:
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: example-com
      namespace: edge
    patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: example-com
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: wildcard-example-com
      namespace: edge
    patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-example-com
