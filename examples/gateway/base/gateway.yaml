apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: signet-edge
  namespace: edge
spec:
  gatewayClassName: replace-with-your-gateway-class
  listeners:
    - name: apex
      hostname: example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: example-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: signet
    - name: wildcard
      hostname: "*.example.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-example-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: signet
