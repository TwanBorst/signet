apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signet
  namespace: signet
spec:
  parentRefs:
    - name: signet-edge
      namespace: edge
      sectionName: wildcard
  hostnames: [signet.example.com]
  rules:
    - backendRefs:
        - name: signet-signet
          port: 8080
