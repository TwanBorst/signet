name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Isolated PostgreSQL and cert-manager matrix
        shell: pwsh
        run: ./tests/verify.ps1
      - name: Build deployment image
        run: docker build -t signet:verify .
